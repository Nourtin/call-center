name: Réconciliation nocturne

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Installer dépendances
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lancer réconciliation
        env:
          CALL_API_BASE_URL: ${{ secrets.CALL_API_BASE_URL }}
          CALL_API_TOKEN:    ${{ secrets.CALL_API_TOKEN }}
          POSTGRES_CONN:     ${{ secrets.POSTGRES_CONN }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}   # ✅ AJOUT
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}   # ✅ AJOUT
        run: python scripts/reconciliation.py