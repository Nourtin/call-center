name: Ingestion appels

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: pip install -r requirements.txt

      - name: Lancer ingestion
        env:
          CALL_API_BASE_URL: ${{ secrets.CALL_API_BASE_URL }}
          CALL_API_TOKEN:    ${{ secrets.CALL_API_TOKEN }}
          POSTGRES_CONN:     ${{ secrets.POSTGRES_CONN }}
        run: python scripts/ingestion.py